# CLASS 2 (CLASS_ROUTED): routed public client prefixes (e.g. PPPoE subscribers
# with their own public IPs), protected via the outbound-SYN LRU rather than
# conntrack (these are typically notrack in the firewall, so the kernel keeps no
# state for them).
#
# IMPORTANT — only enable class 2 where inbound traffic is SYMMETRIC, i.e. it
# enters through the same interface this program is attached to. If inbound to
# these clients bypasses this hook (asymmetric routing: e.g. it goes straight
# from your edge/BGP to the access layer), the filter never sees the attack and
# class 2 does nothing. In that case leave these clients out, or move the filter
# onto the real inbound path. Class 2 is off by default (drop_routed=0).
#
# Static aggregates are preferred over dynamic /32s (which churn per session).
# One CIDR per line. The value below is an RFC 5737 range — REPLACE with yours.
203.0.113.0/24
