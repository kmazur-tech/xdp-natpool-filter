# CLASS 1 (CLASS_NATPOOL): your CGNAT / SNAT public pool prefixes.
#
# These are the public source addresses your NAT hands out. Inbound packets to
# them are legitimate only if the kernel conntrack has a matching entry (a reply
# to a connection a subscriber opened); the filter drops SYN/ACKs (and, when the
# UDP detector engages, unsolicited UDP) that have none.
#
# List ALL your pools, one CIDR per line. Keep this in sync with the NAT source
# set in your firewall (e.g. the nftables set your SNAT rule uses).
#
# The value below is an RFC 5737 documentation range — REPLACE with your own.
192.0.2.0/24
